[package]
name = "sfs"
version = "0.1.0"
edition = "2024"
description = "Shielded from Scratch: Sapling shielded transactions built from the ground up in Rust, for learning"

[dependencies]
# 핀은 ff/group 0.13 생태계에 맞춘다. 0.14는 bls12_381/jubjub/bellman/sapling-crypto/orchard가 아직 안 쓴다.
# 주석 처리된 줄은 그 crate가 처음 필요한 레벨에서 튜터가 푼다. 컴파일 시간을 지금 레벨이 필요한 만큼만 쓰기 위해서다.
ff = "0.13"                          # 필드 트레이트 (L10부터)
bls12_381 = "0.8"                    # Zcash 증명 필드 (L10부터)
# zcash_protocol: 지금은 대조용이라 [dev-dependencies]에 있다. 브랜치 ID 상수가 필요한 레벨에서 여기로 올린다.
# group = "0.13"                     # 나중 월드
# jubjub = "0.10"                    # 나중 월드
# pasta_curves = "0.5.2"             # 나중 월드
# blake2b_simd = "1"                 # 나중 월드
# blake2s_simd = "1"                 # 나중 월드
# sapling-crypto = "0.7"             # 나중 월드
# zcash_note_encryption = "0.4.2"    # 나중 월드
# chacha20poly1305 = "0.10"          # 나중 월드
# incrementalmerkletree = "0.8.2"    # 나중 월드
# reddsa = "0.5"                     # 나중 월드
# bellman = "0.14"                   # 나중 월드
# orchard = "0.15.5"                 # 나중 월드
# zcash_primitives = "0.30.1"        # 나중 월드

[dev-dependencies]
zcash_protocol = "0.10.5"            # 금액 대조 기준 (테스트 전용, L01부터)
