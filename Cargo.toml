[package]
name = "sfs"
version = "0.1.0"
edition = "2024"
description = "Shielded from Scratch: Sapling shielded transactions built from the ground up in Rust, for learning"

[dependencies]
# 핀은 ff/group 0.13 생태계에 맞춘다. 0.14는 bls12_381/jubjub/bellman/sapling-crypto/orchard가 아직 안 쓴다.
# 주석 처리된 줄은 해당 유닛에서 주석을 푼다. 컴파일 시간을 유닛이 필요한 만큼만 쓰기 위해서다.
ff = "0.13"                          # U00, U02~
bls12_381 = "0.8"                    # U00, U03~
# zcash_protocol = "0.10.5"          # U01, U22
# group = "0.13"                     # U04
# jubjub = "0.10"                    # U04
# pasta_curves = "0.5.2"             # Part 1 아이언우드 박스
# blake2b_simd = "1"                 # U07
# blake2s_simd = "1"                 # U07
# sapling-crypto = "0.7"             # U07~ 대조용, U21 circuit
# zcash_note_encryption = "0.4.2"    # U12
# chacha20poly1305 = "0.10"          # U12
# incrementalmerkletree = "0.8.2"    # U13
# reddsa = "0.5"                     # U14
# bellman = "0.14"                   # U16
# orchard = "0.15.5"                 # Part 2 박스, U29
# zcash_primitives = "0.30.1"        # U22~24 대조, U30
